<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Arambh Health - Emergency Fast Admit & Offline SMS</title>
    <meta name="description" content="Zero-delay Fast Admit emergency hotline with voice triage, offline SMS emergency dispatch protocol, AI receptionist, and real-time ER trauma bed vacancies." />
    <meta property="og:title" content="Arambh Health - Emergency Fast Admit & Offline SMS" />
    <meta property="og:description" content="Zero-delay Fast Admit emergency hotline with voice triage, offline SMS emergency dispatch protocol, AI receptionist, and real-time ER trauma bed vacancies." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ArambhCare" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <script>
      (function() {
        var origError = console.error;
        var origWarn = console.warn;
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('failed to connect to websocket'))) {
            return;
          }
          origError.apply(console, arguments);
        };
        console.warn = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.includes('[vite]') || msg.includes('WebSocket'))) {
            return;
          }
          origWarn.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-sky-100 selection:text-sky-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
